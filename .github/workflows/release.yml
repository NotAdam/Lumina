on:
  push:
    tags:
      - '*'

name: Create Release

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.0
      with:
        fetch-depth: 0
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Build with dotnet
      run: dotnet build --configuration Release --nologo ./src/Lumina.sln
    - name: dotnet test
      run: dotnet test --configuration Release --nologo ./src/Lumina.sln
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v5
      with:
        name: Lumina-${{ matrix.os }}
        path: |
          ./src/Lumina/bin/Release/*.nupkg
          ./src/Lumina/bin/Release/*.snupkg
          ./src/Lumina/bin/Release/**/Lumina*.dll
          ./src/Lumina/bin/Release/**/Lumina*.xml
          ./src/Lumina/bin/Release/**/Lumina*.pdb
          ./src/Lumina/bin/Release/**/Lumina*.deps.json
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Lumina ${{ github.ref_name }}
    - name: NuGet login
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: NotAdam
    - name: publish nuget package
      run: dotnet nuget push ./src/Lumina/bin/Release/*.nupkg -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate